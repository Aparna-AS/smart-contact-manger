<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
 

>
  <head>
    <title>Signup</title>
    
  </head>

  <body class="dark:bg-gray-900 bg-blue-300">

<div id="content" >


  <!-- card container -->
  <div class="grid grid-cols-12 w-full">

    <!-- left space -->
    <div class="col-span-4 md:col-span-2 lg:col-span-3 xl:col-span-4"></div>

    <!-- center column -->
    <div class="col-span-12 md:col-span-8 lg:col-span-6 xl:col-span-4">

      <div class="bg-neutral-primary-soft block p-6 border border-default rounded-base shadow-xs 
                  hover:bg-neutral-secondary-medium dark:bg-gray-800 dark:border-gray-700 
                  dark:shadow-lg dark:hover:bg-gray-700">

        <div data-th-replace ="message::messagebox"></div>          

        <h5 class="mb-3 text-2xl font-semibold tracking-tight text-heading leading-8 dark:text-white">
          Signup Here
        </h5>

        <!-- FORM START -->
        <form th:action="@{/do-register}" th:object="${userForm}" method="post"
              class="max-w-sm mx-auto mt-5">

          <!-- NAME -->
          <div class="mb-5">
            <label for="name" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">
              Name
            </label>
            <input type="text" id="name" th:field="*{name}"
                   class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm 
                          rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5
                          shadow-xs placeholder:text-body dark:bg-gray-700 dark:border-gray-600 
                          dark:text-white dark:placeholder-gray-400"
                   placeholder="Your Name" required />
                    <p
                  data-th-if="${#fields.hasErrors('name')}"
                  data-th-errors="*{name}"
                  class="text-red-600 px-1 py-2"
                >
                  Name is required
                </p>
          </div>
          

          <!-- EMAIL -->
          <div class="mb-5">
            <label for="email" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">
              Email
            </label>
            <input type="email" id="email" th:field="*{email}"
                   class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm 
                          rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5
                          shadow-xs placeholder:text-body dark:bg-gray-700 dark:border-gray-600 
                          dark:text-white dark:placeholder-gray-400"
                   placeholder="name@example.com" required />
                   <p
                  data-th-if="${#fields.hasErrors('email')}"
                  data-th-errors="*{email}"
                  class="text-red-600 px-1 py-2"
                ></p>
                   
          </div>

          <!-- PASSWORD -->
          <div class="mb-5">
            <label for="password" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">
              Password
            </label>
            <input type="password" id="password" th:field="*{password}"
                   class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm 
                          rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5
                          shadow-xs placeholder:text-body dark:bg-gray-700 dark:border-gray-600 
                          dark:text-white dark:placeholder-gray-400"
                   placeholder="••••••••" required />
                    <p
                  data-th-if="${#fields.hasErrors('password')}"
                  data-th-errors="*{password}"
                  class="text-red-600 px-1 py-2"
                ></p>
                   
          </div>

          <!-- PHONE -->
          <div class="mb-5">
            <label for="phone" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">
              Phone Number
            </label>
            <input type="text" id="phone" th:field="*{phoneNumber}"
                   class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm 
                          rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5
                          shadow-xs placeholder:text-body dark:bg-gray-700 dark:border-gray-600 
                          dark:text-white dark:placeholder-gray-400"
                   placeholder="+91" required />
                   <p
                  data-th-if="${#fields.hasErrors('phoneNumber')}"
                  data-th-errors="*{phoneNumber}"
                  class="text-red-600 px-1 py-2"
                ></p>
          </div>

          <!-- ABOUT -->
          <div class="mb-3">
            <label for="about" class="block mb-2.5 text-sm font-medium text-heading dark:text-white">
              About / Message
            </label>
            <textarea id="about" rows="6" th:field="*{about}"
                      class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm 
                             rounded-base focus:ring-brand focus:border-brand block w-full p-3.5
                             shadow-xs placeholder:text-body dark:bg-gray-700 dark:border-gray-600 
                             dark:text-white dark:placeholder-gray-400"
                      placeholder="Write your thoughts here"></textarea>
                      <p
                  data-th-if="${#fields.hasErrors('about')}"
                  data-th-errors="*{about}"
                  class="text-red-600 px-1 py-2"
                ></p>
          </div>

          <!-- BUTTONS -->
          <div class="mb-3 flex justify-center space-x-3">

            <button type="submit"
              class="text-white bg-gray-900 rounded-2xl dark:hover:bg-blue-800 hover:bg-blue-900 
                     box-border border border-transparent focus:ring-4
                     focus:ring-blue-300 shadow-xs font-medium leading-5 
                     text-sm px-4 py-2.5 focus:outline-none dark:bg-blue-600 
                     dark:focus:ring-blue-400">
              Signup
            </button>

            <button type="reset"
              class="text-white bg-gray-900 rounded-2xl dark:hover:bg-blue-800 hover:bg-blue-900 
                     box-border border border-transparent focus:ring-4
                     focus:ring-blue-300 shadow-xs font-medium leading-5 
                     text-sm px-4 py-2.5 focus:outline-none dark:bg-blue-600 
                     dark:focus:ring-blue-400">
              Reset
            </button>

          </div>

        </form>
        <!-- FORM END -->

      </div>
    </div>

    <!-- right space -->
    <div class="hidden lg:block lg:col-span-3 xl:col-span-4"></div>

  </div>

</div>

<script>
  console.log("Signup page loaded");
</script>

  </body>
</html>
